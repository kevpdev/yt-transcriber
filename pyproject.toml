[project]
name = "yt-transcriber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "faster-whisper==1.2.1",
    "av>=19.0.1,<20",
    "yt-dlp",
    "deno",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "pyright[nodejs]",
]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.pyright]
include = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=app"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80
