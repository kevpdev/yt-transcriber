<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yt-transcriber</title>
  <script>
    // Runs before first paint to avoid a flash: a saved choice wins, else the system theme.
    // The key and the media query are defined here once, /static/app.js reuses them.
    var THEME_KEY = "yt-transcriber-theme";
    var systemDark = window.matchMedia("(prefers-color-scheme: dark)");
    (function () {
      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
      var dark = saved ? saved === "dark" : systemDark.matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme inline {
      --color-canvas: var(--canvas);
      --color-surface: var(--surface);
      --color-line: var(--line);
      --color-border: var(--border);
      --color-ink: var(--ink);
      --color-muted: var(--muted);
      --color-action: var(--action);
      --color-on-action: var(--on-action);
      --color-action-hover: var(--action-hover);
      --color-accent: var(--accent);
      --color-danger: var(--danger);
    }
  </style>
</head>
<body class="min-h-screen bg-canvas text-ink">
  <main class="mx-auto max-w-4xl px-4 py-10">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold">yt-transcriber</h1>
      <button id="theme" type="button" aria-label="Thème sombre" aria-pressed="false"
              class="rounded-md bg-line p-2 hover:bg-action-hover hover:text-on-action">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </header>

    <form id="form" class="flex gap-2">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"
             class="flex-1 rounded-lg bg-surface border border-border placeholder:text-muted px-3 py-2 outline-none focus:border-accent">
      <button id="go" type="submit"
              class="rounded-lg bg-action text-on-action px-4 py-2 font-medium hover:bg-action-hover disabled:opacity-50 disabled:cursor-not-allowed">
        Transcrire
      </button>
    </form>

    <p id="status" class="mt-3 min-h-6 text-sm text-action"></p>
    <p id="error" role="alert" class="mt-1 text-sm text-danger"></p>

    <div class="relative mt-3">
      <textarea id="out" readonly placeholder="La transcription apparaît ici."
                class="h-[60vh] w-full resize-y rounded-lg bg-surface border border-border placeholder:text-muted p-3 pr-12 text-sm leading-relaxed outline-none"></textarea>
      <button id="copy" type="button" title="Copier" aria-label="Copier la transcription"
              class="absolute right-2 top-2 rounded-md bg-line p-2 hover:bg-action-hover hover:text-on-action">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <rect x="9" y="9" width="13" height="13" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
