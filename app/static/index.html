<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yt-transcriber</title>
  <script>
    // Runs before first paint to avoid a flash: a saved choice wins, else the system theme.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("yt-transcriber-theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    /* Palette B (lagoon and coral), WCAG contrast ratios measured on 2026-10-07,
       with the exact color-mix results. Text needs 4.5, components 3.
       Light: text 16.79 on canvas, 17.79 on surface
              muted 5.98 on canvas, 6.33 on surface (placeholders sit on surface)
              white on action 4.82, white on hovered action 5.7
              accent 4.87 on canvas, danger 6.10 on canvas
              action 4.55 on canvas (component)
              field border 3.41 on canvas, 3.61 on surface
              text on line 12.07 (copy and theme icons)
       Dark:  text 16.79 on canvas, 14.91 on surface
              muted 8.24 on canvas, 7.31 on surface
              dark text on action 4.83, dark text on hovered action 5.6
              accent 6.61 on canvas, danger 6.43 on canvas
              action 4.83 on canvas (component)
              field border 4.09 on canvas, 3.63 on surface
              text on line 11.35 (copy and theme icons)
       --line is the soft fill of the icon buttons, --border outlines the fields. */
    :root {
      color-scheme: light;
      --canvas: #FAF8F5;
      --surface: #FFFFFF;
      --line: #D9D4CC;
      --border: #8C867C;
      --ink: #14181F;
      --muted: color-mix(in srgb, var(--canvas) 32%, var(--ink) 68%);
      --action: #0C7C99;
      --on-action: #FFFFFF;
      --action-hover: color-mix(in srgb, var(--action) 88%, var(--ink) 12%);
      --accent: #D6193F;
      --danger: #B91C1C;
    }
    html.dark {
      color-scheme: dark;
      --canvas: #14181F;
      --surface: #1D232C;
      --line: #2E3744;
      --border: #6E7A8C;
      --ink: #FAF8F5;
      --action: #0891B2;
      --on-action: #14181F;
      --accent: #FB7185;
      --danger: #F87171;
    }
    @theme inline {
      --color-canvas: var(--canvas);
      --color-surface: var(--surface);
      --color-line: var(--line);
      --color-border: var(--border);
      --color-ink: var(--ink);
      --color-muted: var(--muted);
      --color-action: var(--action);
      --color-on-action: var(--on-action);
      --color-action-hover: var(--action-hover);
      --color-accent: var(--accent);
      --color-danger: var(--danger);
    }
  </style>
</head>
<body class="min-h-screen bg-canvas text-ink">
  <main class="mx-auto max-w-4xl px-4 py-10">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold">yt-transcriber</h1>
      <button id="theme" type="button" aria-label="Thème sombre" aria-pressed="false"
              class="rounded-md bg-line p-2 hover:bg-action-hover hover:text-on-action">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </header>

    <form id="form" class="flex gap-2">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"
             class="flex-1 rounded-lg bg-surface border border-border placeholder:text-muted px-3 py-2 outline-none focus:border-accent">
      <button id="go" type="submit"
              class="rounded-lg bg-action text-on-action px-4 py-2 font-medium hover:bg-action-hover disabled:opacity-50 disabled:cursor-not-allowed">
        Transcrire
      </button>
    </form>

    <p id="status" class="mt-3 min-h-6 text-sm text-accent"></p>
    <p id="error" role="alert" class="mt-1 text-sm text-danger"></p>

    <div class="relative mt-3">
      <textarea id="out" readonly placeholder="La transcription apparaît ici."
                class="h-[60vh] w-full resize-y rounded-lg bg-surface border border-border placeholder:text-muted p-3 pr-12 text-sm leading-relaxed outline-none"></textarea>
      <button id="copy" type="button" title="Copier" aria-label="Copier la transcription"
              class="absolute right-2 top-2 rounded-md bg-line p-2 hover:bg-action-hover hover:text-on-action">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <rect x="9" y="9" width="13" height="13" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const THEME_KEY = "yt-transcriber-theme";
      const button = document.getElementById("theme");
      const sync = () => button.setAttribute("aria-pressed", String(root.classList.contains("dark")));
      const hasChoice = () => { try { return localStorage.getItem(THEME_KEY) !== null; } catch { return false; } };
      sync();
      button.addEventListener("click", () => {
        const dark = !root.classList.contains("dark");
        root.classList.toggle("dark", dark);
        try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch {}
        sync();
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (ev) => {
        if (hasChoice()) return;
        root.classList.toggle("dark", ev.matches);
        sync();
      });
    })();
  </script>

  <script>
    const $ = (id) => document.getElementById(id);
    const STAGES = { queued: "En attente", downloading: "Téléchargement de l'audio", transcribing: "Transcription" };
    let timer = null;

    function setBusy(busy) { $("go").disabled = busy; }
    function showError(msg) { $("error").textContent = msg || ""; }

    async function readError(resp) {
      try { return (await resp.json()).detail || resp.statusText; } catch { return resp.statusText; }
    }

    const KEY = "yt-transcriber-job";
    const MAX_RETRIES = 5;

    function remember(id) { try { id ? localStorage.setItem(KEY, id) : localStorage.removeItem(KEY); } catch {} }
    function remembered() { try { return localStorage.getItem(KEY); } catch { return null; } }

    function stop(message) {
      remember(null);
      if (message) showError(message);
      setBusy(false);
    }

    async function poll(id, failures = 0) {
      let job;
      try {
        const resp = await fetch(`/jobs/${id}`);
        if (resp.status === 404) {
          $("status").textContent = "";
          return stop("Ce job n'existe plus, le serveur a sûrement redémarré. Relance la transcription.");
        }
        if (!resp.ok) throw new Error(await readError(resp));
        job = await resp.json();
      } catch (e) {
        if (failures + 1 >= MAX_RETRIES) {
          $("status").textContent = "";
          showError("Le serveur ne répond pas : " + e.message + ". Recharge la page pour reprendre le job.");
          return setBusy(false);
        }
        $("status").textContent = "Connexion perdue, nouvelle tentative…";
        timer = setTimeout(() => poll(id, failures + 1), 2000);
        return;
      }
      showError("");
      if (job.stage === "done") {
        $("out").value = job.text;
        $("status").textContent = "Terminé.";
        return stop();
      }
      if (job.stage === "error") {
        $("status").textContent = "";
        return stop(job.error);
      }
      const pct = job.stage === "transcribing" ? ` · ${Math.round(job.progress * 100)} %` : "";
      $("status").textContent = (STAGES[job.stage] || job.stage) + pct;
      timer = setTimeout(() => poll(id), 2000);
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      clearTimeout(timer);
      showError("");
      $("out").value = "";
      setBusy(true);
      try {
        const resp = await fetch("/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: $("url").value }),
        });
        if (!resp.ok) {
          showError(await readError(resp));
          setBusy(false);
          return;
        }
        $("status").textContent = "En attente";
        const { id } = await resp.json();
        remember(id);
        poll(id);
      } catch (e) {
        showError("Le serveur ne répond pas : " + e.message);
        setBusy(false);
      }
    });

    const resumed = remembered();
    if (resumed) {
      setBusy(true);
      $("status").textContent = "Reprise du job en cours…";
      poll(resumed);
    }

    $("copy").addEventListener("click", async () => {
      const text = $("out").value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        $("out").select();
        document.execCommand("copy");
      }
      $("copy").title = "Copié";
      $("status").textContent = "Texte copié dans le presse-papiers.";
      setTimeout(() => { $("copy").title = "Copier"; }, 1500);
    });
  </script>
</body>
</html>
