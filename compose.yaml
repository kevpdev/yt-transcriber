services:
  yt-transcriber:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOTWORDS: ${HOTWORDS:-Claude Code, Claude, Anthropic, MCP}
      HOST_DOCKER_VERSION: ${HOST_DOCKER_VERSION:-}
    volumes:
      - hf-cache:/hf
      - runs-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
  runs-data:
