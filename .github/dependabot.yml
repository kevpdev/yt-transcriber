version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PyAV 19 breaks faster-whisper 1.2.1 (metadata_errors), see aidd_docs/memory/architecture.md.
      - dependency-name: av
        versions: [">=16"]
