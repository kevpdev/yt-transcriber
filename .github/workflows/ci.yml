name: ci
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format, lint, types and unit tests (scripts/check.sh)
        run: scripts/check.sh

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Page tests against the app with YT_FAKE=1 (scripts/e2e.sh fake)
        run: scripts/e2e.sh fake
