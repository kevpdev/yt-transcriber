name: ci
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format, lint and types (scripts/check.sh --fast)
        run: scripts/check.sh --fast

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit and API tests with the coverage threshold (scripts/check.sh --tests)
        run: scripts/check.sh --tests

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Page tests against the app with YT_FAKE=1 (scripts/e2e.sh fake)
        run: scripts/e2e.sh fake

  security:
    name: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
        env:
          # uv.lock puts the nvidia-* packages in a dependency group, which Trivy skips as dev deps.
          TRIVY_INCLUDE_DEV_DEPS: 'true'
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # The only check the ruleset requires. `always()` keeps it from being skipped when a job fails,
  # since GitHub counts a skipped job as passed.
  ci:
    name: ci
    if: always()
    needs: [lint, unit-tests, e2e, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
